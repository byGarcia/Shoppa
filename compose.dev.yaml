# Development only: the database `pnpm dev` and the test suite talk to.
#
# It is NOT the file Shoppa is installed with — that is compose.yaml, which
# brings up the application as well. This one publishes Postgres on a loopback
# port so a workstation can reach it and hard-codes a throwaway password;
# neither belongs in a deployment.
#
#   pnpm db:up     # start it
#   pnpm db:down   # stop it
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: shopping
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: shopping_dev
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - shopping-postgres:/var/lib/postgresql

volumes:
  shopping-postgres:

